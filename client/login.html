<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login - QueueLess</title>
  <style>
    :root {
      --pri: #0a2a66;
      --pri2: #164eaf;
      --bg: #f7f3ea;
      --card: #ffffff;
      --tx: #1c1c1c;
      --mut: #5a5546;
      --bd: #d9d2c0;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e3eaf5 0%, #f7f3ea 100%);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--tx);
    }
    .container {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-sizing: border-box;
      margin: 16px;
      position: relative;
      overflow: hidden;
    }
    .card-tri {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #ff9933 33%, #ffffff 33% 66%, #138808 66%);
    }
    h1 {
      margin: 0 0 8px;
      color: var(--pri);
      font-size: 2.2rem;
      letter-spacing: -0.5px;
    }
    p.sub {
      color: var(--mut);
      margin: 0 0 32px;
      font-size: 0.95rem;
    }
    
    /* Toggle */
    .toggle-container {
      display: flex;
      background: rgba(10, 42, 102, 0.08);
      border-radius: 99px;
      padding: 4px;
      position: relative;
      margin-bottom: 32px;
    }
    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-weight: 600;
      color: var(--mut);
      cursor: pointer;
      position: relative;
      z-index: 2;
      transition: color 0.3s;
      border-radius: 99px;
      font-size: 0.9rem;
    }
    .toggle-btn.active {
      color: #fff;
    }
    .toggle-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      bottom: 4px;
      width: calc(50% - 4px);
      background: var(--pri);
      border-radius: 99px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
      box-shadow: 0 2px 8px rgba(10,42,102,0.3);
    }
    
    /* Form */
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--tx);
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--bd);
      background: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--pri);
      box-shadow: 0 0 0 4px rgba(10,42,102,0.1);
    }
    button.submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(120deg, var(--pri), var(--pri2));
      color: white;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(10,42,102,0.2);
    }
    button.submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(10,42,102,0.25);
    }
    button.submit:active {
      transform: translateY(1px);
    }
    
    .view {
      display: none;
      animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .view.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #error-msg {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 16px;
      min-height: 20px;
      font-weight: 500;
    }
    
    .tri {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #ff9933 33%, #fff 33% 66%, #138808 66%);
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="tri"></div>

  <div class="container">
    <div class="card-tri"></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px;margin-top:8px">
      <svg width="36" height="36" viewBox="0 0 52 52" fill="none" stroke="var(--pri)" stroke-width="1.2">
        <circle cx="26" cy="26" r="22" stroke-width="2.5"/><circle cx="26" cy="26" r="3" fill="currentColor"/><line x1="26" y1="26" x2="45.0" y2="26.0"/><line x1="26" y1="26" x2="44.4" y2="30.9"/><line x1="26" y1="26" x2="42.5" y2="35.5"/><line x1="26" y1="26" x2="39.4" y2="39.4"/><line x1="26" y1="26" x2="35.5" y2="42.5"/><line x1="26" y1="26" x2="30.9" y2="44.4"/><line x1="26" y1="26" x2="26.0" y2="45.0"/><line x1="26" y1="26" x2="21.1" y2="44.4"/><line x1="26" y1="26" x2="16.5" y2="42.5"/><line x1="26" y1="26" x2="12.6" y2="39.4"/><line x1="26" y1="26" x2="9.5" y2="35.5"/><line x1="26" y1="26" x2="7.6" y2="30.9"/><line x1="26" y1="26" x2="7.0" y2="26.0"/><line x1="26" y1="26" x2="7.6" y2="21.1"/><line x1="26" y1="26" x2="9.5" y2="16.5"/><line x1="26" y1="26" x2="12.6" y2="12.6"/><line x1="26" y1="26" x2="16.5" y2="9.5"/><line x1="26" y1="26" x2="21.1" y2="7.6"/><line x1="26" y1="26" x2="26.0" y2="7.0"/><line x1="26" y1="26" x2="30.9" y2="7.6"/><line x1="26" y1="26" x2="35.5" y2="9.5"/><line x1="26" y1="26" x2="39.4" y2="12.6"/><line x1="26" y1="26" x2="42.5" y2="16.5"/><line x1="26" y1="26" x2="44.4" y2="21.1"/>
      </svg>
      <h1 style="margin:0;">QueueLess</h1>
    </div>
    <p class="sub">Smart Government Office Queues</p>
    
    <div class="toggle-container">
      <div class="toggle-slider" id="slider"></div>
      <button class="toggle-btn active" id="btn-citizen" onclick="setMode('citizen')">Citizen</button>
      <button class="toggle-btn" id="btn-admin" onclick="setMode('admin')">Staff / Admin</button>
    </div>
    
    <div id="view-citizen" class="view active">
      <div class="form-group">
        <label>Mobile Number</label>
        <input type="tel" id="c-phone" placeholder="Enter 10-digit number" maxlength="10">
      </div>
      <button class="submit" onclick="loginCitizen()">Continue</button>
    </div>
    
    <div id="view-admin" class="view">
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" id="a-user" placeholder="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="a-pass" placeholder="••••••••">
      </div>
      <button class="submit" onclick="loginAdmin()">Login</button>
    </div>
    
    <div id="error-msg"></div>
  </div>

  <script>
    function setMode(mode) {
      document.getElementById('error-msg').textContent = '';
      if (mode === 'citizen') {
        document.getElementById('slider').style.transform = 'translateX(0)';
        document.getElementById('btn-citizen').classList.add('active');
        document.getElementById('btn-admin').classList.remove('active');
        document.getElementById('view-citizen').classList.add('active');
        document.getElementById('view-admin').classList.remove('active');
      } else {
        document.getElementById('slider').style.transform = 'translateX(100%)';
        document.getElementById('btn-admin').classList.add('active');
        document.getElementById('btn-citizen').classList.remove('active');
        document.getElementById('view-admin').classList.add('active');
        document.getElementById('view-citizen').classList.remove('active');
      }
    }

    function loginCitizen() {
      const phone = document.getElementById('c-phone').value.trim();
      if (!phone || phone.length < 10) {
        document.getElementById('error-msg').textContent = 'Please enter a valid 10-digit phone number.';
        return;
      }
      localStorage.setItem('ql_session', JSON.stringify({ role: 'citizen', phone }));
      window.location.href = 'index.html';
    }

    function loginAdmin() {
      const user = document.getElementById('a-user').value.trim();
      const pass = document.getElementById('a-pass').value;
      if (user === 'admin' && pass === 'admin123') {
        localStorage.setItem('ql_session', JSON.stringify({ role: 'admin', user }));
        window.location.href = 'admin.html';
      } else {
        document.getElementById('error-msg').textContent = 'Invalid credentials. Hint: admin / admin123';
      }
    }
    
    // Redirect if already logged in
    try {
      const s = JSON.parse(localStorage.getItem('ql_session'));
      if (s && s.role === 'citizen') window.location.href = 'index.html';
      if (s && s.role === 'admin') window.location.href = 'admin.html';
    } catch(e) {}
  </script>
</body>
</html>
